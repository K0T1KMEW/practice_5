<!DOCTYPE html>
<html>
<head>
    <title>Screenshot Service</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; }
        input[type="text"] { width: 300px; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
        button { padding: 10px 20px; background: #007cba; color: white; border: none; border-radius: 4px; cursor: pointer; }
        #status { margin-top: 20px; padding: 15px; border: 1px solid #ddd; border-radius: 4px; }
        .status-item { margin: 10px 0; padding: 8px; }
        .error { color: #dc3232; }
    </style>
</head>
<body>
    <h1>Создание скриншотов</h1>
    
    <form id="screenshotForm">
        <div class="form-group">
            <label for="url">URL:</label>
            <input type="text" id="url" name="url" required placeholder="https://example.com">
        </div>
        <div class="form-group">
            <label for="selector">CSS Selector (опционально):</label>
            <input type="text" id="selector" name="selector" placeholder="#main или .container">
        </div>
        <button type="submit">Создать скриншот</button>
    </form>
    
    <div id="status"></div>

    <script>
        const form = document.getElementById('screenshotForm');
        const statusDiv = document.getElementById('status');
        
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = new FormData(form);
            const url = formData.get('url');
            const selector = formData.get('selector');
            
            try {
                const response = await fetch('/screenshot', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ url, selector }),
                });
                
                const result = await response.json();
                
                if (result.error) {
                    statusDiv.innerHTML += `<div class="status-item error">Ошибка: ${result.message}</div>`;
                    return;
                }
                
                const jobId = result.payload.job_id;
                
                statusDiv.innerHTML += `<div class="status-item">Задача ${jobId}: создана</div>`;
                
                const ws = new WebSocket(`ws://${window.location.host}/ws/status/${jobId}`);
                
                ws.onmessage = (event) => {
                    const data = JSON.parse(event.data);
                    statusDiv.innerHTML += `<div class="status-item">Задача ${data.job_id}: ${data.status} - ${data.message || ''}</div>`;
                };
                
            } catch (error) {
                statusDiv.innerHTML += `<div class="status-item error">Ошибка: ${error.message}</div>`;
            }
        });
    </script>
</body>
</html>
