services:
  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: screenshot-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 5s
      timeout: 30s
      retries: 5
    networks:
      - screenshot-network

  minio:
    image: minio/minio
    container_name: screenshot-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 30s
      retries: 5
    volumes:
      - minio_data:/data
    networks:
      - screenshot-network

  producer:
    build: 
      context: ./producer
    container_name: screenshot-producer
    ports:
      - "8000:8000"
    environment:
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    depends_on:
      rabbitmq:
        condition: service_healthy
    command: ["sh", "-c", "sleep 10 && python main.py"]
    networks:
      - screenshot-network

  screenshot:
    build:
      context: ./screenshot
    container_name: screenshot-worker
    environment:
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    depends_on:
      rabbitmq:
        condition: service_healthy
    command: ["sh", "-c", "sleep 15 && python main.py"]
    networks:
      - screenshot-network

  storage:
    build:
      context: ./storage
    container_name: screenshot-storage
    environment:
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - MINIO_URL=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
    depends_on:
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: ["sh", "-c", "sleep 20 && python main.py"]
    networks:
      - screenshot-network

volumes:
  minio_data:

networks:
  screenshot-network:
    driver: bridge